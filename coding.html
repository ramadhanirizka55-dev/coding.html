<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Hari Guru</title>

    <style>
        body {
            text-align: center;
            background: linear-gradient(120deg, #ffd4e5, #b3e5ff);
            font-family: "Comic Sans MS", cursive;
            overflow: hidden;
        }

        h1 {
            font-size: 40px;
            color: #4b2e83;
            text-shadow: 2px 2px 5px #fff;
            margin-top: 40px;
        }

        p {
            font-size: 22px;
            font-weight: bold;
            background: #fff6b3;
            padding: 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
        }

        .teacher {
            width: 200px;
            margin-top: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }

        /* Konfeti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: yellow;
            border-radius: 50%;
            animation: fall 3s infinite linear;
        }

        @keyframes fall {
            0% { transform: translateY(-10px); opacity: 1; }
            100% { transform: translateY(600px); opacity: 0; }
        }
    </style>
</head>

<body>

    <h1>Selamat Hari Guru Bapak Bapak Tua 🎓</h1>
    <p>dari prinses yg cantik 👑</p>

    <!-- Animasi Guru -->
    <img src="https://cdn-icons-png.flaticon.com/512/7009/7009387.png" class="teacher">

    <script>
        // Membuat konfeti jatuh
        for (let i = 0; i < 40; i++) {
            let confetti = document.createElement("div");
            confetti.classList.add("confetti");
            confetti.style.left = Math.random() * window.innerWidth + "px";
            confetti.style.backgroundColor = `hsl(${Math.random()*360},100%,50%)`;
            confetti.style.animationDuration = 2 + Math.random() * 3 + "s";
            document.body.appendChild(confetti);
        }
    </script>

</body>
</html>
